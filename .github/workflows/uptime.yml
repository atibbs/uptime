name: uptime

# One long run checks every 5 minutes (loop.sh), then starts its successor.
# GitHub's cron scheduler dropped most 5-minute runs on this account, so the
# schedule below is only a backup that restarts the chain if it ever breaks.
# The concurrency group keeps it to one chain: a backup run waits behind the
# active loop, and any extra pending run is replaced by the next one.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: write   # lets the run start its successor with GITHUB_TOKEN

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check sites every 5 minutes
        timeout-minutes: 340
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FACTORY_DISPATCH_TOKEN: ${{ secrets.FACTORY_DISPATCH_TOKEN }}
          LOOP_MINUTES: "330"
        run: bash loop.sh
      - name: Start the next loop
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run uptime.yml --repo "${{ github.repository }}" --ref main
